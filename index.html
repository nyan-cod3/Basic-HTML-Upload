<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sight-seer</title>
    <style>
        /* Fills the screen and centers content */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a;
            font-family: Arial, sans-serif;
        }

        /* The centered upload container card */
        .upload-container {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0, 255, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 2px solid #00ff00;
        }

        h2 {
            margin-top: 0;
            color: #00ff00;
        }

        .file-input {
            margin: 20px 0;
            color: #00ff00;
        }

        .upload-btn {
            background-color: #00ff00;
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .upload-btn:hover {
            background-color: #00cc00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="upload-container">
        <h2>Upload Your File</h2>
        <input type="file" class="file-input" id="fileChooser">
        <br>
        <button class="upload-btn" onclick="alert('File selected!')">spectare</button>
    </div>

</body>
</html>
